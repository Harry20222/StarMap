<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarMap initial-sample comparison fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from "react";
      import { createRoot } from "react-dom/client";
      import { App } from "../../src/App.tsx";
      import { joinGalaxyData, getComparison } from "./exports.ts";
      import original from "../../../results/prototype1_measurements.json" with { type: "json" };
      import markers from "../../../results/markers.json" with { type: "json" };
      import "../../src/styles.css";
      const ids = new Set(original.galaxies.map((g) => g.galaxy_id));
      const field = joinGalaxyData(
        {
          ...markers,
          markers: markers.markers.filter((m) => ids.has(m.galaxy_id)),
        },
        original,
      );
      createRoot(document.getElementById("root")).render(
        createElement(App, { field, comparisonLoader: async (_map, a, b) => getComparison(field, a, b) }),
      );
    </script>
  </body>
</html>
