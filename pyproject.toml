[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jades-starmap"
version = "0.1.0"
description = "A reproducible JADES galaxy distance prototype using Astropy Planck18"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.1,<9",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "fsspec[http]>=2024.6",
  "pymongo>=4.11,<5",
  "dnspython>=2.6,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mongomock>=4.3,<5"]
mongodb = ["pymongo>=4.11,<5", "python-dotenv>=1,<2"]

[project.scripts]
starmap = "starmap.cli:main"

[tool.setuptools.packages.find]
include = ["starmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
